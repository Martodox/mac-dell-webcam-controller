		4E1442E330756C70006A6553 /* Embed Camera Agent */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			name = "Embed Camera Agent";
			shellPath = /bin/sh;
			shellScript = (
				"set -euo pipefail",
				"# Build Dell Camera Agent from the CameraKit package and embed it in Contents/Resources.",
				"PKG=\"${SRCROOT}/CameraKit\"",
				"SCRATCH=\"${DERIVED_FILE_DIR}/agent-build\"",
				"swiftpm() {",
				"  env -i HOME=\"${HOME}\" PATH=\"/usr/bin:/bin:/usr/sbin:/sbin\" DEVELOPER_DIR=\"${DEVELOPER_DIR}\" \\",
				"    xcrun swift build -c release --package-path \"${PKG}\" --scratch-path \"${SCRATCH}\" --product DellCameraAgent \"$@\"",
				"}",
				"swiftpm",
				"BIN=\"$(swiftpm --show-bin-path)/DellCameraAgent\"",
				"RESOURCES=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"",
				"APP=\"${RESOURCES}/Dell Camera Agent.app\"",
				"rm -rf \"${APP}\" \"${RESOURCES}/dell-camera-helper\"",
				"mkdir -p \"${APP}/Contents/MacOS\"",
				"cp -f \"${BIN}\" \"${APP}/Contents/MacOS/DellCameraAgent\"",
				"cp -f \"${PKG}/Support/AgentInfo.plist\" \"${APP}/Contents/Info.plist\"",
				"mkdir -p \"${APP}/Contents/Resources\"",
				"cp -f \"${SRCROOT}/Dell Camera Configurator/DellCamera.icns\" \"${APP}/Contents/Resources/DellCamera.icns\"",
				"printf 'APPL????' > \"${APP}/Contents/PkgInfo\"",
				"if [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ] && [ \"${EXPANDED_CODE_SIGN_IDENTITY}\" != \"-\" ]; then",
				"  codesign --force --options runtime --entitlements \"${PKG}/Support/Agent.entitlements\" \\",
				"    --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \"${APP}\"",
				"else",
				"  codesign --force --entitlements \"${PKG}/Support/Agent.entitlements\" --sign - \"${APP}\"",
				"fi",
				"",
			);
		};
/* End PBXShellScriptBuildPhase section */

